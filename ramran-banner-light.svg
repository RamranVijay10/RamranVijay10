<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7ff"/>
      <stop offset="50%" style="stop-color:#e8f0fe"/>
      <stop offset="100%" style="stop-color:#f5f0ff"/>
    </linearGradient>
    <linearGradient id="nameGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="borderGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glowL">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .nameL { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 46px; font-weight: 900; fill: url(#nameGradL); filter: url(#glowL); animation: namePulseL 4s ease-in-out infinite; }
      .titleL { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #475569; letter-spacing: 3px; }
      .tagL { font-family: monospace; font-size: 10px; }
      .blinkL { animation: blinkL 1.2s step-end infinite; }
      .borderLineL { stroke-dasharray: 2200; stroke-dashoffset: 2200; animation: drawBorderL 3s ease forwards; }
      @keyframes namePulseL { 0%,100%{opacity:1} 50%{opacity:0.9} }
      @keyframes blinkL { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes drawBorderL { to{stroke-dashoffset:0} }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGradL)" rx="16"/>

  <!-- Subtle grid -->
  <g opacity="0.06" fill="#0066cc">
    <circle cx="50" cy="50" r="1.2"/><circle cx="150" cy="50" r="1.2"/><circle cx="250" cy="50" r="1.2"/><circle cx="350" cy="50" r="1.2"/><circle cx="450" cy="50" r="1.2"/><circle cx="550" cy="50" r="1.2"/><circle cx="650" cy="50" r="1.2"/><circle cx="750" cy="50" r="1.2"/><circle cx="850" cy="50" r="1.2"/>
    <circle cx="50" cy="110" r="1.2"/><circle cx="150" cy="110" r="1.2"/><circle cx="250" cy="110" r="1.2"/><circle cx="350" cy="110" r="1.2"/><circle cx="450" cy="110" r="1.2"/><circle cx="550" cy="110" r="1.2"/><circle cx="650" cy="110" r="1.2"/><circle cx="750" cy="110" r="1.2"/><circle cx="850" cy="110" r="1.2"/>
    <circle cx="50" cy="170" r="1.2"/><circle cx="150" cy="170" r="1.2"/><circle cx="250" cy="170" r="1.2"/><circle cx="350" cy="170" r="1.2"/><circle cx="450" cy="170" r="1.2"/><circle cx="550" cy="170" r="1.2"/><circle cx="650" cy="170" r="1.2"/><circle cx="750" cy="170" r="1.2"/><circle cx="850" cy="170" r="1.2"/>
  </g>

  <!-- Soft orbs -->
  <circle cx="130" cy="110" r="90" fill="#dbeafe" opacity="0.5"/>
  <circle cx="770" cy="110" r="80" fill="#ede9fe" opacity="0.5"/>
  <circle cx="450" cy="30" r="55" fill="#cffafe" opacity="0.4"/>

  <!-- Left code decoration -->
  <text x="28" y="82" class="tagL" fill="#0066cc" opacity="0.45">&lt;code&gt;</text>
  <text x="28" y="155" class="tagL" fill="#0066cc" opacity="0.45">&lt;/code&gt;</text>
  <text x="22" y="120" class="tagL" fill="#7c3aed" opacity="0.35">  &gt; build()</text>

  <!-- Right code decoration -->
  <text x="828" y="82" class="tagL" fill="#0891b2" opacity="0.45">{ JS }</text>
  <text x="820" y="155" class="tagL" fill="#0891b2" opacity="0.45">[ ... ]</text>
  <text x="822" y="120" class="tagL" fill="#7c3aed" opacity="0.35">// dev</text>

  <!-- Main name -->
  <text x="450" y="108" text-anchor="middle" class="nameL">Ramran Vijay Pratap</text>
  <text x="730" y="105" class="blinkL" font-family="monospace" font-size="38" fill="#0066cc" opacity="0.6">_</text>

  <!-- Subtitle -->
  <text x="450" y="147" text-anchor="middle" class="titleL">⚡  FULL STACK DEVELOPER  ⚡</text>

  <!-- Tech pills -->
  <g opacity="0.8">
    <rect x="259" y="163" width="46" height="20" rx="10" fill="#dbeafe" stroke="#0066cc" stroke-width="0.8"/>
    <text x="282" y="177" text-anchor="middle" class="tagL" fill="#0066cc">HTML</text>

    <rect x="313" y="163" width="40" height="20" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="333" y="177" text-anchor="middle" class="tagL" fill="#7c3aed">CSS</text>

    <rect x="361" y="163" width="46" height="20" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="0.8"/>
    <text x="384" y="177" text-anchor="middle" class="tagL" fill="#0891b2">JS</text>

    <rect x="415" y="163" width="54" height="20" rx="10" fill="#dbeafe" stroke="#0066cc" stroke-width="0.8"/>
    <text x="442" y="177" text-anchor="middle" class="tagL" fill="#0066cc">React</text>

    <rect x="477" y="163" width="62" height="20" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="508" y="177" text-anchor="middle" class="tagL" fill="#7c3aed">Node.js</text>

    <rect x="547" y="163" width="44" height="20" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="0.8"/>
    <text x="569" y="177" text-anchor="middle" class="tagL" fill="#0891b2">SQL</text>

    <rect x="599" y="163" width="42" height="20" rx="10" fill="#dbeafe" stroke="#0066cc" stroke-width="0.8"/>
    <text x="620" y="177" text-anchor="middle" class="tagL" fill="#0066cc">Git</text>
  </g>

  <!-- Animated border -->
  <rect class="borderLineL" x="2" y="2" width="896" height="216" rx="15" fill="none" stroke="url(#borderGradL)" stroke-width="1.5"/>
</svg>
