<svg xmlns="http://www.w3.org/2000/svg" width="330" height="480" viewBox="0 0 330 480">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1d3a"/>
      <stop offset="100%" style="stop-color:#0a1124"/>
    </linearGradient>
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06ffa5"/>
    </linearGradient>
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="50%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00d2ff" flood-opacity="0.25"/>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .swing { 
        transform-origin: 165px 10px; 
        animation: swingCard 3.5s ease-in-out infinite;
      }
      .cardText { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; }
      .initials { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; font-weight: 900; font-size: 36px; fill: white; filter: url(#glowText); }
      .badge { fill: #0a1124; stroke: #00d2ff; stroke-width: 0.8; rx: 8; }
      .badgeText { font-family: monospace; font-size: 9px; fill: #00d2ff; }
      @keyframes swingCard {
        0%   { transform: rotate(-8deg); }
        25%  { transform: rotate(0deg); }
        50%  { transform: rotate(8deg); }
        75%  { transform: rotate(0deg); }
        100% { transform: rotate(-8deg); }
      }
    </style>
  </defs>

  <!-- Entire card group with swing animation -->
  <g class="swing">
    <!-- Lanyard clip at top -->
    <rect x="152" y="2" width="26" height="14" rx="4" fill="#374151"/>
    <rect x="159" y="6" width="12" height="6" rx="2" fill="#1f2937"/>

    <!-- Lanyard cord -->
    <path d="M165 16 Q140 60 148 90 Q155 120 165 80 Q175 120 182 90 Q190 60 165 16" fill="url(#cordGrad)" opacity="0.7"/>

    <!-- Card body -->
    <rect x="25" y="90" width="280" height="370" rx="16" fill="url(#cardGrad)" filter="url(#cardShadow)"/>

    <!-- Top color bar -->
    <rect x="25" y="90" width="280" height="8" rx="0" fill="url(#topBarGrad)"/>
    <rect x="25" y="90" width="280" height="24" rx="0" fill="url(#topBarGrad)" opacity="0.5"/>
    <!-- Fix top corners for top bar -->
    <rect x="25" y="90" width="16" height="24" fill="url(#topBarGrad)" opacity="0.5"/>
    <path d="M25 90 Q25 90 41 90 L41 114 Q33 114 25 106 Z" fill="none"/>

    <!-- Card rounded top -->
    <rect x="25" y="96" width="280" height="374" rx="0" fill="none"/>

    <!-- "DEVELOPER ID" label -->
    <text x="165" y="128" text-anchor="middle" class="cardText" font-size="10" font-weight="600" fill="#00d2ff" letter-spacing="4" opacity="0.9">DEVELOPER  ID</text>

    <!-- Avatar circle -->
    <circle cx="165" cy="200" r="60" fill="url(#avatarGrad)" opacity="0.15"/>
    <circle cx="165" cy="200" r="56" fill="url(#avatarGrad)"/>
    <circle cx="165" cy="200" r="58" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- Initials -->
    <text x="165" y="215" text-anchor="middle" class="initials">RVP</text>

    <!-- Divider line -->
    <line x1="55" y1="272" x2="275" y2="272" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Name -->
    <text x="165" y="298" text-anchor="middle" class="cardText" font-size="20" font-weight="800" fill="white" letter-spacing="0.5">Ramran Vijay Pratap</text>

    <!-- Title -->
    <text x="165" y="322" text-anchor="middle" class="cardText" font-size="13" font-weight="400" fill="#a78bfa" letter-spacing="1">⚡ Full Stack Developer</text>

    <!-- Divider -->
    <line x1="55" y1="338" x2="275" y2="338" stroke="#1e3a5f" stroke-width="1"/>

    <!-- GitHub label row -->
    <text x="55" y="360" class="cardText" font-size="10" fill="#64748b" font-weight="600">GITHUB</text>
    <text x="275" y="360" text-anchor="end" class="cardText" font-size="10" fill="#00d2ff">@RamranVijay10</text>

    <!-- Status row -->
    <text x="55" y="382" class="cardText" font-size="10" fill="#64748b" font-weight="600">STATUS</text>
    <circle cx="195" cy="377" r="4" fill="#06ffa5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="204" y="382" class="cardText" font-size="10" fill="#06ffa5">Open to Work</text>

    <!-- Skills -->
    <text x="55" y="404" class="cardText" font-size="10" fill="#64748b" font-weight="600">STACK</text>
    <text x="275" y="404" text-anchor="end" class="cardText" font-size="10" fill="#a78bfa">HTML · CSS · JS · Node</text>

    <!-- Bottom barcode-like decoration -->
    <g transform="translate(55, 420)" opacity="0.4">
      <rect x="0" y="0" width="3" height="22" fill="#00d2ff"/>
      <rect x="6" y="0" width="1" height="22" fill="#a78bfa"/>
      <rect x="10" y="0" width="4" height="22" fill="#00d2ff"/>
      <rect x="17" y="0" width="2" height="22" fill="#a78bfa"/>
      <rect x="22" y="0" width="5" height="22" fill="#00d2ff"/>
      <rect x="30" y="0" width="1" height="22" fill="#a78bfa"/>
      <rect x="34" y="0" width="3" height="22" fill="#00d2ff"/>
      <rect x="40" y="0" width="2" height="22" fill="#a78bfa"/>
      <rect x="45" y="0" width="4" height="22" fill="#00d2ff"/>
      <rect x="52" y="0" width="1" height="22" fill="#a78bfa"/>
      <rect x="56" y="0" width="3" height="22" fill="#00d2ff"/>
      <rect x="62" y="0" width="5" height="22" fill="#a78bfa"/>
      <rect x="70" y="0" width="2" height="22" fill="#00d2ff"/>
      <rect x="75" y="0" width="3" height="22" fill="#a78bfa"/>
      <rect x="81" y="0" width="1" height="22" fill="#00d2ff"/>
      <rect x="85" y="0" width="4" height="22" fill="#a78bfa"/>
      <rect x="92" y="0" width="2" height="22" fill="#00d2ff"/>
      <rect x="97" y="0" width="3" height="22" fill="#a78bfa"/>
      <rect x="103" y="0" width="5" height="22" fill="#00d2ff"/>
      <rect x="111" y="0" width="1" height="22" fill="#a78bfa"/>
      <rect x="115" y="0" width="4" height="22" fill="#00d2ff"/>
      <rect x="122" y="0" width="2" height="22" fill="#a78bfa"/>
      <rect x="127" y="0" width="3" height="22" fill="#00d2ff"/>
      <rect x="133" y="0" width="1" height="22" fill="#a78bfa"/>
      <rect x="137" y="0" width="5" height="22" fill="#00d2ff"/>
      <rect x="145" y="0" width="2" height="22" fill="#a78bfa"/>
      <rect x="150" y="0" width="3" height="22" fill="#00d2ff"/>
      <rect x="156" y="0" width="4" height="22" fill="#a78bfa"/>
      <rect x="163" y="0" width="1" height="22" fill="#00d2ff"/>
      <rect x="167" y="0" width="3" height="22" fill="#a78bfa"/>
      <rect x="173" y="0" width="2" height="22" fill="#00d2ff"/>
      <rect x="178" y="0" width="5" height="22" fill="#a78bfa"/>
      <rect x="186" y="0" width="1" height="22" fill="#00d2ff"/>
      <rect x="190" y="0" width="3" height="22" fill="#a78bfa"/>
      <rect x="196" y="0" width="4" height="22" fill="#00d2ff"/>
      <rect x="203" y="0" width="2" height="22" fill="#a78bfa"/>
      <rect x="208" y="0" width="3" height="22" fill="#00d2ff"/>
      <rect x="214" y="0" width="1" height="22" fill="#a78bfa"/>
    </g>
    <text x="165" y="454" text-anchor="middle" class="cardText" font-size="8" fill="#1e3a5f" letter-spacing="2">RVP-2024-FULLSTACK-DEV</text>

    <!-- Card border glow -->
    <rect x="25" y="90" width="280" height="370" rx="16" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
